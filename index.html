```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACER WebDoc | Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 15% 20%, rgba(0, 105, 210, .20), transparent 36%),
        radial-gradient(circle at 85% 80%, rgba(0, 65, 150, .22), transparent 38%),
        #050b16;
    color: #fff;
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 420px;
    padding: 42px 38px;
    background: rgba(12, 24, 43, .92);
    border: 1px solid rgba(45, 125, 220, .30);
    border-radius: 20px;
    box-shadow: 0 20px 70px rgba(0, 0, 0, .55);
    backdrop-filter: blur(18px);
}

.logo {
    margin: 0 auto 20px;
    text-align: center;
    color: #ffffff;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 3px;
    line-height: 1;
    text-shadow: 0 0 24px rgba(35, 125, 255, .35);
}

h1 {
    text-align: center;
    font-size: 27px;
    letter-spacing: .5px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #91a8c8;
    font-size: 13px;
    margin-bottom: 34px;
}

label {
    display: block;
    color: #c5d4e8;
    font-size: 13px;
    margin-bottom: 9px;
}

.input-group {
    margin-bottom: 21px;
}

input {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid #263d5e;
    border-radius: 10px;
    outline: none;
    background: #081426;
    color: white;
    font-size: 14px;
    transition: .2s;
}

input::placeholder {
    color: #71839d;
}

input:focus {
    border-color: #398cff;
    box-shadow: 0 0 0 3px rgba(45, 130, 255, .13);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: 1px solid rgba(105, 170, 255, .25);
    border-radius: 10px;
    background: linear-gradient(135deg, #1768c5, #0b438e);
    color: #ffffff;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
    box-shadow: 0 7px 22px rgba(0, 75, 170, .22);
}

button:hover {
    filter: brightness(1.15);
    transform: translateY(-1px);
}

button:disabled {
    opacity: .6;
    cursor: wait;
    transform: none;
}

.message {
    display: none;
    margin-top: 18px;
    padding: 12px;
    border-radius: 9px;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
}

.error {
    display: block;
    color: #ffaaaa;
    background: rgba(180, 30, 30, .13);
    border: 1px solid rgba(255, 80, 80, .25);
}

.footer {
    text-align: center;
    color: #7185a2;
    font-size: 11px;
    margin-top: 30px;
}

@media (max-width: 480px) {
    .login-container {
        padding: 35px 25px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">ACER</div>

    <h1>Welcome Back</h1>
    <p class="subtitle">WebDoc · Call Documentation System</p>

    <form id="loginForm">

        <div class="input-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" id="loginButton">
            Sign In
        </button>

        <div id="message" class="message"></div>

    </form>

    <div class="footer">
        Authorized personnel only · WebDoc
    </div>

</div>

<script>
const API_BASE = "https://acer-cloud-backend.vercel.app/api";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    message.className = "message";
    message.textContent = "";

    button.disabled = true;
    button.textContent = "Signing in...";

    try {
        const response = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const result = await response.json();

        if (!response.ok || !result.token || !result.user) {
            throw new Error(result.error || "Invalid username or password.");
        }

        localStorage.setItem("webdoc_token", result.token);
        localStorage.setItem("webdoc_user", JSON.stringify(result.user));

        window.location.href = "dashboard.html";

    } catch (error) {
        message.textContent = error.message || "Unable to connect to the server.";
        message.className = "message error";

        button.disabled = false;
        button.textContent = "Sign In";
    }
});
</script>

</body>
</html>
```
