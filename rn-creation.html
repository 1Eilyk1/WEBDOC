
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RN Creation</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f5f6fb;color:#111722;font-family:Arial,sans-serif}
.rn-container{max-width:950px;margin:auto}
.rn-panel{background:#050711;border:1px solid #e5e4ef;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 5px 20px rgba(38,32,80,.05)}
.rn-heading{margin:0 0 18px;font-size:20px;font-weight:800;color:#ffffff}
.rn-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rn-field{display:flex;flex-direction:column;gap:7px}
.rn-field.full-width{grid-column:1/-1}
.rn-field label,.rn-filter label{font-size:11px;font-weight:800;color:#ffffff}
.rn-field input,.rn-field textarea,.rn-filter input{width:100%;border:1px solid #44406b;border-radius:8px;padding:11px 12px;font:inherit;font-size:13px;color:#292844;background:#44406b;outline:none}
.rn-field input:focus,.rn-field textarea:focus,.rn-filter input:focus{border-color:#7773dc;box-shadow:0 0 0 3px rgba(119,115,220,.1)}
.rn-field textarea{min-height:100px;resize:vertical}
.rn-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.rn-btn{border:none;border-radius:8px;min-height:38px;padding:0 16px;background:#667eea;color:#fff;font-size:11px;font-weight:800;cursor:pointer}
.rn-btn:hover{filter:brightness(.96)}
.rn-btn.secondary{background:#eeedf7;color:#514d83}
.rn-btn.danger{background:#fff0f0;color:#c34444}
.rn-btn:disabled{opacity:.45;cursor:not-allowed}
.rn-history-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rn-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rn-filter input{width:auto;min-width:150px;padding:8px 10px}
.rn-count{font-size:11px;color:#77748e;font-weight:700;margin-bottom:12px}
.rn-history-list{display:flex;flex-direction:column;gap:14px}
.rn-day-heading{margin:8px 0 0;padding-bottom:8px;border-bottom:1px solid #e9e7f3;color:#514d83;font-size:12px;font-weight:900}
.rn-history-card{padding:16px;border:1px solid #e5e3f0;border-radius:11px;background:#fff}
.rn-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.rn-card-title{margin:0;font-size:14px;font-weight:900;color:#514d83;overflow-wrap:anywhere}
.rn-card-date{margin-top:5px;font-size:10px;color:#89869d}
.rn-detail-list{display:flex;flex-direction:column;gap:10px}
.rn-detail{padding:11px;border-radius:8px;background:#f8f8fc;border:1px solid #efedf6;min-width:0}
.rn-detail-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.rn-detail-label{color:#77728f;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.3px}
.rn-detail-value{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:#34324c}
.rn-copy-btn{flex-shrink:0;border:0;border-radius:6px;padding:6px 9px;background:#e9e8fb;color:#514d83;font-size:9px;font-weight:900;cursor:pointer}
.rn-card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.rn-pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;padding:12px;border:1px solid #e3e1ec;border-radius:10px;background:#fafaff}
.rn-pagination button{min-height:34px;padding:0 14px;border:none;border-radius:7px;background:#667eea;color:white;font-size:9px;font-weight:900;cursor:pointer}
.rn-pagination button:disabled{background:#e6e5ed;color:#aaa9b8;cursor:not-allowed}
#rnPageInfo{color:#514d83;font-size:10px;font-weight:900;white-space:nowrap}
.rn-empty{padding:28px 15px;text-align:center;color:#89869d;font-size:12px;border:1px dashed #dcd9ea;border-radius:10px}
.rn-status{min-height:16px;margin-top:10px;font-size:11px;color:#514d83}
@media(max-width:600px){
body{padding:10px}
.rn-panel{padding:15px}
.rn-form-grid{grid-template-columns:1fr}
.rn-field.full-width{grid-column:auto}
.rn-card-header{flex-direction:column}
.rn-filter{width:100%}
.rn-filter input{flex:1;min-width:0}
}
@media(max-width:400px){
.rn-pagination{gap:6px;padding:8px 4px}
.rn-pagination button{padding:0 8px;font-size:8px}
}

/* WEBDOC DASHBOARD THEME — RN CREATION */
:root{--rn-text:#e8edf5;--rn-muted:#8d99ab;--rn-accent:#60a5fa}
html{min-height:100%;background:#050711}
body{
 min-height:100vh;padding:28px 22px;color:var(--rn-text);
 background:
 radial-gradient(ellipse at 14% 18%,rgba(0,229,255,.20),transparent 31%),
 radial-gradient(ellipse at 84% 22%,rgba(157,78,221,.22),transparent 32%),
 radial-gradient(ellipse at 70% 82%,rgba(0,112,255,.20),transparent 35%),
 radial-gradient(ellipse at 26% 78%,rgba(255,0,153,.10),transparent 30%),
 linear-gradient(135deg,#050711 0%,#090d1b 48%,#060713 100%);
 background-attachment:fixed;font-family:Inter,Arial,Helvetica,sans-serif;position:relative;isolation:isolate
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.22;
 background-image:linear-gradient(rgba(90,160,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(90,160,255,.10) 1px,transparent 1px);
 background-size:54px 54px;mask-image:linear-gradient(to bottom,black,transparent 92%)}
.rn-container{max-width:1120px}
.rn-panel{background:linear-gradient(145deg,rgba(17,27,43,.96),rgba(9,17,31,.96));border:1px solid rgba(64,154,255,.30);border-radius:20px;padding:26px;margin-bottom:22px;box-shadow:0 18px 48px rgba(0,0,0,.38),0 0 28px rgba(0,111,255,.07),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(18px)}
.rn-heading{color:#f3f8ff;font-size:21px;letter-spacing:.15px}
.rn-field label,.rn-filter label{color:#c7d6eb;font-size:11px;letter-spacing:.25px}
.rn-field input,.rn-field textarea,.rn-filter input{color:#edf5ff;background:#091525;border:1px solid #344761;border-radius:10px;padding:12px 13px;font-size:13px;box-shadow:inset 0 1px 4px rgba(0,0,0,.18);transition:border-color .18s,box-shadow .18s,background .18s}
.rn-field input::placeholder,.rn-field textarea::placeholder,.rn-filter input::placeholder{color:#8295b1;opacity:1}
.rn-field input:focus,.rn-field textarea:focus,.rn-filter input:focus{outline:none;border-color:#42bdf5;background:#0b1b30;box-shadow:0 0 0 3px rgba(0,217,255,.12),0 0 18px rgba(0,153,255,.10)}
.rn-field textarea{min-height:112px}
.rn-field small{color:#91a8c7!important;line-height:1.55}
.rn-btn,.rn-pagination button{min-height:39px;border-radius:9px;padding:0 16px;background:linear-gradient(135deg,#2365b8,#17477f);border:1px solid #397cc5;color:#f5f9ff;font-size:10px;font-weight:800;letter-spacing:.35px;box-shadow:0 5px 16px rgba(0,85,180,.20);transition:transform .16s,filter .16s,box-shadow .16s}
.rn-btn:hover,.rn-pagination button:not(:disabled):hover{filter:brightness(1.14);transform:translateY(-1px);box-shadow:0 7px 20px rgba(0,153,255,.22)}
.rn-btn.secondary{background:linear-gradient(135deg,#1b2a40,#142238);color:#dceaff;border:1px solid #3a506e;box-shadow:none}
.rn-btn.danger{background:linear-gradient(135deg,#542638,#351b2a);color:#ffdce5;border:1px solid #85415a;box-shadow:none}
.rn-btn:disabled,.rn-pagination button:disabled{opacity:.4}
.rn-history-toolbar{padding-bottom:14px;border-bottom:1px solid rgba(91,151,225,.16)}
.rn-filter input{min-width:160px;padding:9px 11px;color-scheme:dark}
.rn-count{color:#91a8c7;margin:14px 0}
.rn-day-heading{color:#9bc9ff;border-bottom:1px solid rgba(91,151,225,.24);font-size:12px;letter-spacing:.4px;padding:0 0 9px}
.rn-history-card{background:linear-gradient(145deg,#142238,#0d1728);border:1px solid #344761;border-radius:14px;padding:18px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.rn-card-title{color:#eff6ff;font-size:15px}.rn-card-date{color:#91a8c7}
.rn-detail{background:rgba(7,17,31,.72);border:1px solid #263b55;border-radius:10px;padding:12px}
.rn-detail-label{color:#8eadd2}.rn-detail-value{color:#e0ecfb;line-height:1.65}
.rn-copy-btn{background:#172f4d;color:#a9d5ff;border:1px solid #31577e;border-radius:7px;transition:.15s}
.rn-copy-btn:hover{background:#20466f;color:#fff}
.rn-pagination{background:rgba(10,22,39,.8);border:1px solid #2c405b;border-radius:11px;padding:13px}
#rnPageInfo{color:#b9d8ff}
.rn-pagination button:disabled{background:#1b2637;color:#718096;border:1px solid #2b3a50}
.rn-empty{color:#9aacc5;background:rgba(9,20,36,.65);border:1px dashed #3a506e;border-radius:12px;padding:34px 18px}
.rn-status{color:#8fc9ff}
#rnBackToChat{background:linear-gradient(135deg,#172a45,#1d3b61)!important;color:#eaf3ff!important;border:1px solid #34577f!important;border-radius:9px!important;box-shadow:0 5px 16px rgba(0,0,0,.18)}
#rnBackToChat:hover{border-color:#60a5fa!important;filter:brightness(1.12)}
input[type="date"]{color-scheme:dark}
@media(max-width:600px){body{padding:12px 10px}.rn-panel{padding:17px;border-radius:15px}.rn-heading{font-size:19px}}

</style>

<body>
<div class="rn-container">

<section class="rn-panel">
    <button type="button"
      onclick="window.location.href='dashboard.html'"
      style="margin-bottom:12px;padding:9px 15px;border-radius:8px;
      background:#172438;color:#e8edf5;border:1px solid #38516e;
      cursor:pointer;font-weight:600;">
      ← Back to Dashboard
    </button>
    <h1 class="rn-heading" style="margin-top:18px">RN Creation</h1>

    <form id="rnCreationForm">
        <div class="rn-form-grid">
            <div class="rn-field">
                <label for="rnSnid">SNID / Serial Number</label>
                <input id="rnSnid" type="text" required>
            </div>
            <div class="rn-field">
                <label for="rnEmail">Customer Email</label>
                <input id="rnEmail" type="email" required>
            </div>
            <div class="rn-field">
                <label for="rnNumber">RN Number</label>
                <input id="rnNumber" type="text" placeholder="123456-123456" pattern="[0-9]{6}-[0-9]{6}" title="Enter RN number in 000000-000000 format" required>
            </div>
            <div class="rn-field">
                <label for="rnCustomerName">Customer Name</label>
                <input id="rnCustomerName" type="text" required>
            </div>
            <div class="rn-field full-width">
                <label for="rnCustomerMessage">Customer Message</label>
                <textarea id="rnCustomerMessage" required placeholder="Paste the customer's message here..."></textarea>
            </div>
            <div class="rn-field full-width">
                <label for="rnAIPrompt">Additional AI Instructions (Optional)</label>
                <textarea id="rnAIPrompt" rows="3" placeholder="Tell the AI how you want it to respond. Example: Apologise for the inconvenience, explain that we are checking the repair status, and ask the customer to allow 1–2 business days for an update."></textarea>
                <small style="display:block;margin-top:6px;opacity:.75;">The AI will review the customer message and use these instructions when drafting your reply. Leave blank to use the standard Acer support instructions.</small>
            </div>
            <div class="rn-field full-width">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
                    <label for="rnMyReply">My Reply</label>
                    <button class="rn-btn" type="button" id="rnGenerateReply">✨ GENERATE AI REPLY</button>
                </div>
                <textarea id="rnMyReply" required placeholder="Your generated reply will appear here. Review and edit it before saving."></textarea>
                <div id="rnAIStatus" class="rn-status" role="status" aria-live="polite"></div>
            </div>
        </div>

        <div class="rn-actions">
            <button class="rn-btn" type="submit">DONE / SAVE RN</button>
            <button class="rn-btn secondary" type="button" id="rnClearForm">CLEAR FORM</button>
        </div>
        <div id="rnFormStatus" class="rn-status" role="status"></div>
    </form>
</section>

<section class="rn-panel">
    <div class="rn-history-toolbar">
        <h2 class="rn-heading" style="margin:0">Saved RN History</h2>
        <div class="rn-filter">
            <label for="rnDateFilter">Filter by date</label>
            <input type="date" id="rnDateFilter">
            <button type="button" class="rn-btn secondary" id="rnClearFilter">SHOW ALL</button>
        </div>
    </div>

    <div id="rnRecordCount" class="rn-count"></div>
    <div id="rnHistoryList" class="rn-history-list"></div>

    <div class="rn-pagination" id="rnPagination">
        <button type="button" id="rnPrevPage">← PREVIOUS</button>
        <span id="rnPageInfo">Page 1 of 1</span>
        <button type="button" id="rnNextPage">NEXT →</button>
    </div>
</section>
</div>

<script>
(function(){
"use strict";

const STORAGE_KEY = "rnCreationHistory";
const RN_PER_PAGE = 1;

const $ = id => document.getElementById(id);
const form = $("rnCreationForm");
const formStatus = $("rnFormStatus");
const dateFilter = $("rnDateFilter");
const historyList = $("rnHistoryList");
const pagination = $("rnPagination");
const pageInfo = $("rnPageInfo");
const prevButton = $("rnPrevPage");
const nextButton = $("rnNextPage");

// AI reply connection. Replace this placeholder with your deployed Cloudflare Worker URL.
const AI_API_URL = "https://rn-ai-reply.jhon-kylie-padilla.workers.dev/";
const generateReplyButton = $("rnGenerateReply");
const aiStatus = $("rnAIStatus");
const myReplyField = $("rnMyReply");

generateReplyButton.addEventListener("click", async () => {
    const customerMessage = $("rnCustomerMessage").value.trim();
    const customerName = $("rnCustomerName").value.trim();
    const rnNumber = $("rnNumber").value.trim();
    const aiPrompt = $("rnAIPrompt").value.trim();

    if (!customerMessage) {
        aiStatus.textContent = "Please enter the customer's message first.";
        $("rnCustomerMessage").focus();
        return;
    }

    if (myReplyField.value.trim() &&
        !confirm("Replace the current My Reply text with a newly generated draft?")) {
        return;
    }

    if (AI_API_URL === "PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE") {
        aiStatus.textContent = "Connection not configured yet. Add your Cloudflare Worker URL in AI_API_URL.";
        return;
    }

    generateReplyButton.disabled = true;
    generateReplyButton.textContent = "GENERATING...";
    aiStatus.textContent = "Preparing your draft...";

    try {
        const response = await fetch(AI_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ customerMessage, customerName, rnNumber, aiPrompt })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(data.error || "The AI service could not generate a reply.");
        }
        if (!data.reply || typeof data.reply !== "string") {
            throw new Error("The AI service returned an empty reply.");
        }

        myReplyField.value = data.reply.trim();
        myReplyField.dispatchEvent(new Event("input", { bubbles: true }));
        aiStatus.textContent = "Draft generated. Please review and edit it before saving.";
    } catch (error) {
        aiStatus.textContent = "Unable to generate reply: " + error.message;
    } finally {
        generateReplyButton.disabled = false;
        generateReplyButton.textContent = "✨ GENERATE AI REPLY";
    }
});

let currentPage = 1;
let history = loadHistory();

function safeString(value){
    return value == null ? "" : String(value);
}

/* Supports both new and older saved records */
function loadHistory(){
    try{
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if(!Array.isArray(stored)) return [];

        return stored.map((item,index)=>{
            item = item && typeof item === "object" ? item : {};

            return {
                id: safeString(item.id || ("legacy-" + index + "-" + safeString(item.rnNumber || item.rn))),
                snid: safeString(item.snid || item.SNID || item.serialNumber || item.serial || item.sn),
                email: safeString(item.email || item.customerEmail),
                rnNumber: safeString(item.rnNumber || item.rn || item.RN || item.rn_number),
                customerName: safeString(item.customerName || item.name || item.customer || item.customer_name),
                customerMessage: safeString(item.customerMessage || item.message || item.customer_message),
                myReply: safeString(item.myReply || item.reply || item.response || item.my_reply),
                timestamp: safeString(item.timestamp || item.createdAt || item.created_at),
                date: safeString(item.date || item.savedDate || item.createdDate || item.created_at || "")
            };
        });
    }catch(error){
        return [];
    }
}

function persistHistory(){
    try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        return true;
    }catch(error){
        formStatus.textContent = "Unable to save history in browser storage.";
        return false;
    }
}

function dateToISO(year,month,day){
    return year + "-" + String(month).padStart(2,"0") + "-" + String(day).padStart(2,"0");
}

/* Convert common old date formats into yyyy-mm-dd */
function normalizeDate(value){
    if(!value) return "";

    const raw = String(value).trim();

    let match = raw.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if(match) return dateToISO(Number(match[1]),Number(match[2]),Number(match[3]));

    match = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(match){
        const first = Number(match[1]);
        const second = Number(match[2]);
        const year = Number(match[3]);

        /* Legacy dates in this app were displayed as en-GB: DD/MM/YYYY */
        return dateToISO(year,second,first);
    }

    match = raw.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
    if(match){
        const first = Number(match[1]);
        const second = Number(match[2]);
        const year = Number(match[3]);

        /* Prefer DD-MM-YYYY for legacy records */
        return dateToISO(year,second,first);
    }

    const parsed = new Date(raw);
    if(!Number.isNaN(parsed.getTime())){
        return dateToISO(parsed.getFullYear(),parsed.getMonth()+1,parsed.getDate());
    }

    return "";
}

function getRecordDay(record){
    if(record.timestamp){
        const parsed = new Date(record.timestamp);
        if(!Number.isNaN(parsed.getTime())){
            return dateToISO(parsed.getFullYear(),parsed.getMonth()+1,parsed.getDate());
        }
    }

    return normalizeDate(record.date);
}

function displayDate(record){
    const day = getRecordDay(record);
    if(!day) return record.date || "Date unavailable";

    const parts = day.split("-").map(Number);
    return new Date(parts[0],parts[1]-1,parts[2]).toLocaleDateString(undefined,{
        year:"numeric",
        month:"long",
        day:"numeric"
    });
}

function displayTimestamp(record){
    if(record.timestamp){
        const d = new Date(record.timestamp);
        if(!Number.isNaN(d.getTime())) return d.toLocaleString();
    }
    return displayDate(record);
}

function el(tag,className,text){
    const node = document.createElement(tag);
    if(className) node.className = className;
    if(text !== undefined) node.textContent = text;
    return node;
}

function copyText(text){
    const value = safeString(text);

    if(navigator.clipboard && window.isSecureContext){
        return navigator.clipboard.writeText(value);
    }

    return new Promise((resolve,reject)=>{
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.setAttribute("readonly","");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();

        let copied = false;
        try{ copied = document.execCommand("copy"); }catch(e){ copied = false; }

        textarea.remove();
        copied ? resolve() : reject(new Error("Copy failed"));
    });
}

function copyFeedback(button,text){
    const original = button.textContent;
    button.disabled = true;

    copyText(text).then(()=>{
        button.textContent = "COPIED!";
    }).catch(()=>{
        button.textContent = "FAILED";
    }).finally(()=>{
        button.disabled = false;
        setTimeout(()=>button.textContent = original,1200);
    });
}

function makeDetail(label,value){
    const detail = el("div","rn-detail");
    const top = el("div","rn-detail-top");
    const labelNode = el("span","rn-detail-label",label);
    const copyButton = el("button","rn-copy-btn","COPY");
    copyButton.type = "button";
    copyButton.addEventListener("click",()=>copyFeedback(copyButton,value));

    const valueNode = el("div","rn-detail-value",value || "—");
    top.append(labelNode,copyButton);
    detail.append(top,valueNode);
    return detail;
}

function createCard(record){
    const card = el("article","rn-history-card");
    const header = el("div","rn-card-header");
    const headingGroup = el("div");
    headingGroup.append(
        el("h3","rn-card-title",record.rnNumber || "RN record"),
        el("div","rn-card-date",displayTimestamp(record))
    );

    const details = el("div","rn-detail-list");
    details.append(
        makeDetail("SNID / Serial Number",record.snid),
        makeDetail("Customer Email",record.email),
        makeDetail("RN Number",record.rnNumber),
        makeDetail("Customer Name",record.customerName),
        makeDetail("Customer Message",record.customerMessage),
        makeDetail("My Reply",record.myReply)
    );

    const actions = el("div","rn-card-actions");
    const copyAll = el("button","rn-btn","COPY ALL DETAILS");
    copyAll.type = "button";
    copyAll.addEventListener("click",()=>{
        const all = [
            ["SNID / Serial Number",record.snid],
            ["Customer Email",record.email],
            ["RN Number",record.rnNumber],
            ["Customer Name",record.customerName],
            ["Customer Message",record.customerMessage],
            ["My Reply",record.myReply]
        ].map(row=>row[0] + ":\n" + row[1]).join("\n\n");

        copyFeedback(copyAll,all);
    });

    const deleteButton = el("button","rn-btn danger","DELETE");
    deleteButton.type = "button";
    deleteButton.addEventListener("click",()=>{
        if(!confirm("Delete this RN record?")) return;
        history = history.filter(item=>item.id !== record.id);
        persistHistory();
        renderHistory();
    });

    actions.append(copyAll,deleteButton);
    header.append(headingGroup);
    card.append(header,details,actions);
    return card;
}

function renderHistory(){
    historyList.replaceChildren();

    const selectedDay = dateFilter.value;

    const filtered = history
        .filter(record=>{
            if(!selectedDay) return true;
            return getRecordDay(record) === selectedDay;
        })
        .sort((a,b)=>{
            const aTime = a.timestamp ? new Date(a.timestamp).getTime() : 0;
            const bTime = b.timestamp ? new Date(b.timestamp).getTime() : 0;
            return bTime - aTime;
        });

    $("rnRecordCount").textContent =
        filtered.length + " RN record" + (filtered.length === 1 ? "" : "s");

    if(!filtered.length){
        historyList.appendChild(el(
            "div",
            "rn-empty",
            selectedDay
                ? "No RN records found for this date. Check the date format on older records or click SHOW ALL."
                : "No saved RN records yet."
        ));
        pagination.style.display = "none";
        return;
    }

    const totalPages = Math.max(1,Math.ceil(filtered.length/RN_PER_PAGE));
    currentPage = Math.max(1,Math.min(currentPage,totalPages));

    const start = (currentPage-1)*RN_PER_PAGE;
    const visibleRecords = filtered.slice(start,start+RN_PER_PAGE);

    pageInfo.textContent = "Page " + currentPage + " of " + totalPages;
    prevButton.disabled = currentPage <= 1;
    nextButton.disabled = currentPage >= totalPages;
    pagination.style.display = "flex";

    visibleRecords.forEach(record=>{
        historyList.appendChild(el("h3","rn-day-heading",displayDate(record)));
        historyList.appendChild(createCard(record));
    });
}

function changePage(direction){
    currentPage += direction;
    renderHistory();
}

form.addEventListener("submit",event=>{
    event.preventDefault();
    if(!form.reportValidity()) return;

    const now = new Date();
    const rnNumber = $("rnNumber").value.trim();

    if(!/^\d{6}-\d{6}$/.test(rnNumber)){
        $("rnNumber").setCustomValidity("Enter RN number in 000000-000000 format.");
        $("rnNumber").reportValidity();
        return;
    }
    $("rnNumber").setCustomValidity("");

    const record = {
        id:"rn-" + now.getTime() + "-" + Math.random().toString(36).slice(2,8),
        snid:$("rnSnid").value.trim(),
        email:$("rnEmail").value.trim(),
        rnNumber,
        customerName:$("rnCustomerName").value.trim(),
        customerMessage:$("rnCustomerMessage").value.trim(),
        myReply:$("rnMyReply").value.trim(),
        timestamp:now.toISOString(),
        date:dateToISO(now.getFullYear(),now.getMonth()+1,now.getDate())
    };

    history.unshift(record);

    if(!persistHistory()){
        history.shift();
        return;
    }

    dateFilter.value = getRecordDay(record);
    currentPage = 1;
    renderHistory();

    formStatus.textContent = "RN record saved successfully.";
    form.reset();
});

$("rnNumber").addEventListener("input",()=>{
    $("rnNumber").setCustomValidity("");
});

$("rnClearForm").addEventListener("click",()=>{
    form.reset();
    formStatus.textContent = "";
    $("rnNumber").setCustomValidity("");
});

dateFilter.addEventListener("change",()=>{
    currentPage = 1;
    renderHistory();
});

$("rnClearFilter").addEventListener("click",()=>{
    dateFilter.value = "";
    currentPage = 1;
    renderHistory();
});

prevButton.addEventListener("click",()=>changePage(-1));
nextButton.addEventListener("click",()=>changePage(1));

/* Back to chat: return to the previous page */
$("rnBackToChat").addEventListener("click",()=>{
    if(window.history.length > 1){
        window.history.back();
    }else{
        window.location.href = "index.html";
    }
});

renderHistory();
})();
</script>
</body>
